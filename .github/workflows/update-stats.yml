      # --- 生成 Streak Stats 卡片 (深色) ---
      - name: Generate Streak Stats Dark
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=gruvbox-dark&hide_border=true&background=0d1117&stroke=103fb8&ring=165dff&fire=165dff&currStreakNum=e6edf7&sideNums=4080ff&dates=e6edf7&border_radius=12
          path: profile/streak-dark.svg
          token: ${{ secrets.GH_PAT }}

      # --- 生成 Streak Stats 卡片 (浅色) ---
      - name: Generate Streak Stats Light
        uses: DenverCoder1/github-readme-streak-stats@main
        with:
          options: user=${{ github.repository_owner }}&theme=default&hide_border=true&background=ffffff&stroke=c6dafc&ring=165dff&fire=165dff&currStreakNum=222222&sideNums=4080ff&dates=333333&border_radius=12
          path: profile/streak-light.svg
          token: ${{ secrets.GH_PAT }}
